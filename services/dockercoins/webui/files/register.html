<!doctype html>
<html>
<head>
<title>DockerCoins - Register</title>
<style>
body { font-family: sans-serif; margin: 40px auto; max-width: 600px; }
nav { background: #333; padding: 10px; margin-bottom: 20px; }
nav a { color: #fff; margin-right: 15px; text-decoration: none; }
.form-group { margin-bottom: 15px; }
label { display: block; margin-bottom: 5px; font-weight: bold; }
input[type="text"], input[type="password"], input[type="email"] { width: 100%; padding: 8px; box-sizing: border-box; }
button { padding: 10px 20px; background: steelblue; color: white; border: none; cursor: pointer; }
</style>
</head>
<body>
<nav>
  <a href="/dashboard">Dashboard</a>
  <a href="/board">Board</a>
  <a href="/admin">Admin</a>
  <a href="/login">Login</a>
</nav>

<h1>Register</h1>

<form method="POST" action="/register">
  <div class="form-group">
    <label>Username</label>
    <input type="text" name="username" required>
  </div>
  <div class="form-group">
    <label>Email</label>
    <input type="email" name="email" required>
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" name="password" required>
  </div>
  <button type="submit">Register</button>
</form>

<p>Already have an account? <a href="/login">Login</a></p>
</body>
</html>
