<!doctype html>
<html>
<head>
<title>DockerCoins - Login</title>
<script src="jquery.js"></script>
<style>
body { font-family: sans-serif; margin: 40px auto; max-width: 600px; }
nav { background: #333; padding: 10px; margin-bottom: 20px; }
nav a { color: #fff; margin-right: 15px; text-decoration: none; }
.form-group { margin-bottom: 15px; }
label { display: block; margin-bottom: 5px; font-weight: bold; }
input[type="text"], input[type="password"], input[type="email"] { width: 100%; padding: 8px; box-sizing: border-box; }
button { padding: 10px 20px; background: steelblue; color: white; border: none; cursor: pointer; }
.error { color: red; margin-bottom: 10px; }
.info { color: green; margin-bottom: 10px; }
</style>
</head>
<body>
<nav>
  <a href="/dashboard">Dashboard</a>
  <a href="/board">Board</a>
  <a href="/admin">Admin</a>
  <a href="/login">Login</a>
</nav>

<h1>Login</h1>

<div id="message"></div>

<form method="POST" action="/login">
  <div class="form-group">
    <label>Username</label>
    <input type="text" name="username" autocomplete="on">
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" name="password" autocomplete="on">
  </div>
  <button type="submit">Login</button>
</form>

<p>Don't have an account? <a href="/register">Register</a></p>
<p>Default: admin / admin123</p>

<script>
var params = new URLSearchParams(window.location.search);
if (params.get('error')) {
  // A03: reflected XSS - error param rendered without escaping
  $('#message').html('<div class="error">' + params.get('error') + '</div>');
}
if (params.get('msg')) {
  $('#message').html('<div class="info">' + params.get('msg') + '</div>');
}
</script>
</body>
</html>
