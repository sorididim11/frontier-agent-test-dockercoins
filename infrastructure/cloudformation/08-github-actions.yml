AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub Actions OIDC Integration for ECR Push

Parameters:
  ProjectName:
    Type: String
    Default: devops-agent-test

  Environment:
    Type: String
    Default: 'devops-agent-test'
    Description: Environment name (passed by deploy.sh)

  GitHubOrg:
    Type: String
    Default: sorididim11
    Description: GitHub organization or username
  
  GitHubRepo:
    Type: String
    Default: frontier-devops-agent-test-app
    Description: GitHub repository name

Resources:
  # GitHub OIDC Identity Provider
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        # GitHub's OIDC thumbprint (can be any value as AWS validates via TLS)
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-github-oidc
        - Key: Project
          Value: !Ref ProjectName
        - Key: auto-delete
          Value: 'never'
        - Key: Environment
          Value: !Ref ProjectName

  # IAM Role for GitHub Actions
  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-github-actions-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOIDCProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # Allow any branch from the specified repo
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}/${GitHubRepo}:*
      Policies:
        - PolicyName: ECRPushPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # ECR Authentication
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              # ECR Push permissions for project repositories
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeRepositories
                  - ecr:DescribeImages
                  - ecr:ListImages
                Resource:
                  - !Sub arn:aws:ecr:us-east-1:${AWS::AccountId}:repository/${ProjectName}/*
        - PolicyName: EKSDeployPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # EKS Cluster access
              - Effect: Allow
                Action:
                  - eks:DescribeCluster
                Resource:
                  - !Sub arn:aws:eks:us-east-1:${AWS::AccountId}:cluster/${ProjectName}-cluster
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-github-actions-role
        - Key: Project
          Value: !Ref ProjectName
        - Key: auto-delete
          Value: 'never'
        - Key: Environment
          Value: !Ref ProjectName

Outputs:
  GitHubActionsRoleArn:
    Description: ARN of the IAM Role for GitHub Actions
    Value: !GetAtt GitHubActionsRole.Arn
    Export:
      Name: !Sub ${ProjectName}-github-actions-role-arn
  
  GitHubOIDCProviderArn:
    Description: ARN of the GitHub OIDC Provider
    Value: !Ref GitHubOIDCProvider
    Export:
      Name: !Sub ${ProjectName}-github-oidc-provider-arn
