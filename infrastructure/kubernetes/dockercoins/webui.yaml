apiVersion: apps/v1
kind: Deployment
metadata:
  name: webui
  namespace: dockercoins
  labels:
    app: webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webui
  template:
    metadata:
      labels:
        app: webui
      annotations:
        # Application Signals auto-instrumentation for Node.js (CommonJS)
        instrumentation.opentelemetry.io/inject-nodejs: "true"
    spec:
      containers:
      - name: webui
        image: 111111111111.dkr.ecr.us-east-1.amazonaws.com/devops-agent-test/webui:latest
        ports:
        - containerPort: 80
        env:
        - name: REDIS_HOST
          value: "redis"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: webui
  namespace: dockercoins
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
    service.beta.kubernetes.io/aws-load-balancer-scheme: internal
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  selector:
    app: webui
  ports:
  - port: 80
    targetPort: 80
