apiVersion: apps/v1
kind: Deployment
metadata:
  name: hasher
  namespace: dockercoins
  labels:
    app: hasher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hasher
  template:
    metadata:
      labels:
        app: hasher
      annotations:
        # Application Signals auto-instrumentation for Python (same as rng)
        instrumentation.opentelemetry.io/inject-python: "true"
    spec:
      containers:
      - name: hasher
        image: 111111111111.dkr.ecr.us-east-1.amazonaws.com/devops-agent-test/hasher:20260408-165600
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: hasher
  namespace: dockercoins
spec:
  selector:
    app: hasher
  ports:
  - port: 80
    targetPort: 80
