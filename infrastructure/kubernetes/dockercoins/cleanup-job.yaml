apiVersion: batch/v1
kind: CronJob
metadata:
  name: investigation-cleanup
  namespace: dockercoins
spec:
  schedule: "*/2 * * * *"  # every 2 minutes
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 300
      template:
        spec:
          serviceAccountName: default
          restartPolicy: Never
          containers:
          - name: cleanup
            image: python:3.11-slim
            command: ["python3", "-c"]
            args:
            - |
              import boto3, urllib.request, json

              TABLE = 'devops-agent-test-investigation-events'
              REGION = 'us-east-1'

              table = boto3.resource('dynamodb', region_name=REGION).Table(TABLE)

              # Scan for cleanup_requested items
              resp = table.scan(
                  FilterExpression='cleanup_requested = :val',
                  ExpressionAttributeValues={':val': True}
              )
              items = resp.get('Items', [])
              if not items:
                  print('No cleanup needed')
                  exit(0)

              print(f'Found {len(items)} cleanup requests')

              # Reset all fault injections
              endpoints = [
                  'http://hasher/config/cache?mode=normal',
                  'http://rng/config/response?quality=normal',
                  'http://hasher/clear-latency',
              ]
              for url in endpoints:
                  try:
                      resp = urllib.request.urlopen(url, timeout=5)
                      print(f'OK: {url} -> {resp.status}')
                  except Exception as e:
                      print(f'WARN: {url} -> {e}')

              # Mark cleanup done
              for item in items:
                  table.update_item(
                      Key={'task_id': item['task_id']},
                      UpdateExpression='SET cleanup_requested = :val, cleanup_done_at = :ts',
                      ExpressionAttributeValues={
                          ':val': False,
                          ':ts': __import__('datetime').datetime.utcnow().isoformat() + 'Z'
                      }
                  )
                  print(f'Cleanup done for task: {item["task_id"]}')
            env:
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
            resources:
              requests:
                memory: "64Mi"
                cpu: "50m"
              limits:
                memory: "128Mi"
                cpu: "100m"
