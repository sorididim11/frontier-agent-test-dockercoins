apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: dockercoins
  labels:
    app: worker
    app.kubernetes.io/name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: DockerCoins
      annotations:
        instrumentation.opentelemetry.io/inject-python: "true"
    spec:
      containers:
      - name: worker
        image: worker:latest
        env:
        - name: REDIS_HOST
          value: "redis"
        - name: RNG_HOST
          value: "rng"
        - name: HASHER_HOST
          value: "hasher"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
