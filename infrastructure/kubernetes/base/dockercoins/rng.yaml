apiVersion: apps/v1
kind: Deployment
metadata:
  name: rng
  namespace: dockercoins
  labels:
    app: rng
    app.kubernetes.io/name: rng
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rng
  template:
    metadata:
      labels:
        app: rng
        app.kubernetes.io/name: rng
        app.kubernetes.io/part-of: DockerCoins
      annotations:
        instrumentation.opentelemetry.io/inject-python: "true"
    spec:
      containers:
      - name: rng
        image: rng:latest
        ports:
        - containerPort: 80
        env:
        - name: DB_HOST
          value: "__DB_HOST__"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "devopsagentdb"
        - name: DB_USER
          value: "dbadmin"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rds-credentials
              key: password
              optional: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rng
  namespace: dockercoins
spec:
  selector:
    app: rng
  ports:
  - port: 80
    targetPort: 80
