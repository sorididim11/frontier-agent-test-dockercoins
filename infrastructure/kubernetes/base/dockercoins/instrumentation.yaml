# Unified Application Signals Instrumentation for dockercoins namespace
# Supports both Python (rng, worker) and Node.js (webui) auto-instrumentation
# Note: Ruby (hasher) is NOT supported for auto-instrumentation
apiVersion: cloudwatch.aws.amazon.com/v1alpha1
kind: Instrumentation
metadata:
  name: application-signals
  namespace: dockercoins
spec:
  exporter:
    endpoint: http://cloudwatch-agent.amazon-cloudwatch:4316
  sampler:
    type: xray
  propagators:
    - tracecontext
    - baggage
    - xray
  python:
    # Use addon-provided version (v0.12.1) to fix psutil binary compatibility issue
    # v0.8.0 had __sched_cpufree symbol not found error on AL2 nodes
    image: 602401143452.dkr.ecr.us-east-1.amazonaws.com/eks/observability/adot-autoinstrumentation-python:v0.12.1
    env:
      - name: OTEL_PYTHON_DISTRO
        value: aws_distro
      - name: OTEL_PYTHON_CONFIGURATOR
        value: aws_configurator
      - name: OTEL_TRACES_SAMPLER
        value: xray
      - name: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://cloudwatch-agent.amazon-cloudwatch:4316
      - name: OTEL_AWS_APPLICATION_SIGNALS_ENABLED
        value: "true"
      - name: OTEL_AWS_APPLICATION_SIGNALS_EXPORTER_ENDPOINT
        value: http://cloudwatch-agent.amazon-cloudwatch:4316/v1/metrics
      - name: OTEL_METRICS_EXPORTER
        value: none
      - name: OTEL_LOGS_EXPORTER
        value: none
  nodejs:
    image: 602401143452.dkr.ecr.us-east-1.amazonaws.com/eks/observability/adot-autoinstrumentation-node:v0.7.0
    env:
      - name: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://cloudwatch-agent.amazon-cloudwatch:4316
      - name: OTEL_AWS_APPLICATION_SIGNALS_ENABLED
        value: "true"
      - name: OTEL_AWS_APPLICATION_SIGNALS_EXPORTER_ENDPOINT
        value: http://cloudwatch-agent.amazon-cloudwatch:4316/v1/metrics
      - name: OTEL_METRICS_EXPORTER
        value: none
      - name: OTEL_LOGS_EXPORTER
        value: none
