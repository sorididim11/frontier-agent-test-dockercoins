apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: splunk
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 5s
        send_batch_size: 256
      resource:
        attributes:
          - key: service.namespace
            value: petclinic
            action: upsert

    exporters:
      splunk_hec/traces:
        token: "${env:HEC_TOKEN}"
        endpoint: "https://splunk-hec.splunk.svc.cluster.local:8088"
        source: "otel"
        sourcetype: "otel:traces"
        index: "otel_traces"
        tls:
          insecure_skip_verify: true
      splunk_hec/metrics:
        token: "${env:HEC_TOKEN}"
        endpoint: "https://splunk-hec.splunk.svc.cluster.local:8088"
        source: "otel"
        sourcetype: "otel:metrics"
        index: "otel_metrics"
        tls:
          insecure_skip_verify: true
      splunk_hec/logs:
        token: "${env:HEC_TOKEN}"
        endpoint: "https://splunk-hec.splunk.svc.cluster.local:8088"
        source: "otel"
        sourcetype: "otel:logs"
        index: "otel_logs"
        tls:
          insecure_skip_verify: true

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch, resource]
          exporters: [splunk_hec/traces]
        metrics:
          receivers: [otlp]
          processors: [batch, resource]
          exporters: [splunk_hec/metrics]
        logs:
          receivers: [otlp]
          processors: [batch, resource]
          exporters: [splunk_hec/logs]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: splunk
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.97.0
          args: ["--config=/etc/otel/config.yaml"]
          env:
            - name: HEC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: splunk-credentials
                  key: SPLUNK_HEC_TOKEN
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          volumeMounts:
            - name: config
              mountPath: /etc/otel
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: splunk
  labels:
    app: otel-collector
spec:
  type: ClusterIP
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
